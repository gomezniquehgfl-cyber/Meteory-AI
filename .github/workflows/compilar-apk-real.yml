name: Build Meteory IA v1.0.1
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653

      - name: Install
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact --no-audit --no-fund

      - name: Build
        run: |
          npm run build || npx vite build
          ls -la dist

      - name: Capacitor
        run: |
          rm -rf android capacitor.config.* www public
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" --web-dir=dist
          node -e "const fs=require('fs');let t=fs.readFileSync('capacitor.config.ts','utf8');t=t.replace(/(appId:\s*['\"][^'\"]+['\"])/,\"\$1,\n  appName: 'Meteory IA',\n  version: '1.0.1'\");fs.writeFileSync('capacitor.config.ts',t);console.log(t)"
          npx cap add android
          npx cap sync android

      - name: Icon
        run: |
          SRC=""
          test -f icono_meteory.png && SRC=icono_meteory.png
          test -f icono_meteory.jpg && SRC=icono_meteory.jpg
          if [ -n "$SRC" ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp -f $SRC android/app/src/main/res/$d/ic_launcher.png
              cp -f $SRC android/app/src/main/res/$d/ic_launcher_round.png
            done
            echo OK_ICON
          else
            echo NO_ICON
          fi

      - name: Permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<uses-permission /d' $M
          P='
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />'
          sed -i "/<application/i\\$P" $M
          sed -i 's/android:label="[^"]*"/android:label="Meteory IA"/g' $M
          head -80 $M

      - name: Keystore
        run: |
          rm -f $HOME/meteory.keystore
          keytool -genkey -v -keystore $HOME/meteory.keystore -alias meteory -keyalg RSA -keysize 2048 -validity 10000 -storepass meteory123 -keypass meteory123 -dname "CN=Niquel Gomez, OU=Meteory IA, O=Dev, L=Cochabamba, ST=Cochabamba, C=BO"

      - name: Build APK arm64-v8a
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/meteory.keystore -Pandroid.injected.signing.store.password=meteory123 -Pandroid.injected.signing.key.alias=meteory -Pandroid.injected.signing.key.password=meteory123 -PabiFilters=arm64-v8a

      - name: Final APK
        run: |
          mkdir -p APK_FINAL
          ORIG=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          test -z "$ORIG" && echo APK_FAIL && exit 1
          cp $ORIG APK_FINAL/Meteory-IA-v1.0.1-arm64-v8a.apk
          ls -lh APK_FINAL

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v1.0.1-APK-LISTO
          path: APK_FINAL/*.apk
          if-no-files-found: error
