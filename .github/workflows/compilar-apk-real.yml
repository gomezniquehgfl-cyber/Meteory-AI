name: Compilar APK REAL Meteory IA v5.5
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar tu código
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Configurar Java 17 (obligatorio para Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Instalar ANDROID SDK + NDK OFICIALES
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            build-tools;34.0.0
            platforms;android-34
            ndk;25.2.9519653

      - name: 📦 Instalar todo lo que necesita tu app
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

      - name: 🏗️ Construir la app lista para empaquetar
        run: |
          npm run build || npx vite build

      - name: ⚡ Preparar Capacitor para Android NATIVO
        run: |
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" \
            --web-dir=dist \
            --version=5.5
          npx cap add android
          npx cap sync

      - name: 🔑 AGREGAR PERMISOS ANDROID REALES
        run: |
          MANIFIESTO=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
            <uses-permission android:name="android.permission.INTERNET" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n' $MANIFIESTO

      - name: 📱 COMPILAR APK NATIVO ARM64-v8a (para tu Honor X8b)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$ANDROID_HOME/debug.keystore \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: ✅ Renombrar APK final con tu nombre y versión
        run: |
          mkdir -p APK_FINAL
          cp android/app/build/outputs/apk/release/*.apk APK_FINAL/Meteory-IA-v5.5-NATIVO-arm64-v8a.apk
          ls -lh APK_FINAL/

      - name: ⬆️ Subir APK LISTO PARA INSTALAR
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v5.5-APK-REAL
          path: APK_FINAL/*.apk
          if-no-files-found: error
