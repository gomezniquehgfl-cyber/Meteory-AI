name: Compilar APK REAL Meteory IA v1.0.1
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar tu código
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            build-tools;34.0.0
            platforms;android-34
            ndk;25.2.9519653

      - name: 📦 Instalar dependencias + Capacitor 6 + Generador de iconos
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact
          npm install @capacitor/assets --save-dev

      - name: 🏗️ Construir app
        run: |
          npm run build || npx vite build

      - name: ⚡ Capacitor + nombre + versión 1.0.1
        run: |
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" --web-dir=dist
          node -e "
            const fs = require('fs');
            let t = fs.readFileSync('capacitor.config.ts','utf8');
            t = t.replace(/(appId:\s*['\"][^'\"]+['\"])/, \"\$1,\\n  version: '1.0.1'\\n  appName: 'Meteory IA'\");
            fs.writeFileSync('capacitor.config.ts', t);
            console.log('✅ nombre + versión aplicados');
          "
          npx cap add android
          npx cap sync

      - name: 🎨 GENERAR ICONOS EN TODAS LAS RESOLUCIONES DESDE TU PNG
        run: |
          # Creamos carpeta de recursos y copiamos tu icono
          mkdir -p assets
          cp icono_meteory.png assets/icon.png 2>/dev/null || cp icono_meteory.png assets/icon.png || true
          ls -la assets/
          # Genera TODOS los tamaños de Android automáticamente
          npx capacitor-assets generate --android --iconBackgroundColor '#05050a' || true

      - name: 🔑 Permisos Android
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
            <uses-permission android:name="android.permission.INTERNET" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n' $M

      - name: 🔐 Firma APK
        run: |
          keytool -genkey -v \
            -keystore $HOME/meteory.keystore \
            -alias meteory \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass meteory123 -keypass meteory123 \
            -dname "CN=Niquel Gomez, OU=Meteory IA, O=Dev, L=Cochabamba, ST=Cochabamba, C=BO" || true

      - name: 📱 COMPILAR APK ARM64
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/meteory.keystore \
            -Pandroid.injected.signing.store.password=meteory123 \
            -Pandroid.injected.signing.key.alias=meteory \
            -Pandroid.injected.signing.key.password=meteory123

      - name: ✅ APK final
        run: |
          mkdir -p APK_FINAL
          cp android/app/build/outputs/apk/release/*.apk APK_FINAL/Meteory-IA-v1.0.1-NATIVO-arm64-v8a.apk
          ls -lh APK_FINAL/

      - name: ⬆️ Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v1.0.1-APK-REAL-ICONO-NUEVO
          path: APK_FINAL/*.apk
          if-no-files-found: error
