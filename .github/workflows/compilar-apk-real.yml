name: Compilar APK REAL Meteory IA v1.0.1
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar tu código
        uses: actions/checkout@v4

      - name: 🟢 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: ☕ Java 17 (Android + keytool)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Android SDK + NDK oficiales
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            build-tools;34.0.0
            platforms;android-34
            ndk;25.2.9519653

      - name: 📦 Instalar dependencias + Capacitor v6
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact

      - name: 🏗️ Construir app → carpeta dist
        run: |
          npm run build || npx vite build

      - name: ⚡ Capacitor + versión 1.0.1 (archivo .ts)
        run: |
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" --web-dir=dist
          node -e "
            const fs = require('fs');
            let t = fs.readFileSync('capacitor.config.ts','utf8');
            t = t.replace(/(appId:\s*['\"][^'\"]+['\"])/, \"\$1,\\n  version: '1.0.1'\");
            fs.writeFileSync('capacitor.config.ts', t);
            console.log('✅ versión 1.0.1 aplicada');
          "
          npx cap add android
          npx cap sync

      - name: 🔑 Permisos Android NATIVOS REALES
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i\
            <uses-permission android:name="android.permission.INTERNET" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n\
            <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n\
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n\
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n' $M

      # 🔐 ARREGLO DEFINITIVO: CREAMOS NUESTRO PROPIO CERTIFICADO DE FIRMA
      - name: 🔐 Generar keystore propio para firmar el APK
        run: |
          keytool -genkey -v \
            -keystore $HOME/meteory.keystore \
            -alias meteory \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass meteory123 \
            -keypass meteory123 \
            -dname "CN=Niquel Gomez, OU=Meteory IA, O=Desarrollo, L=Cochabamba, ST=Cochabamba, C=BO"
          ls -lh $HOME/meteory.keystore

      - name: 📱 COMPILAR APK ARM64-v8a (Honor X8b · Android 14)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/meteory.keystore \
            -Pandroid.injected.signing.store.password=meteory123 \
            -Pandroid.injected.signing.key.alias=meteory \
            -Pandroid.injected.signing.key.password=meteory123

      - name: ✅ Preparar APK final
        run: |
          mkdir -p APK_FINAL
          cp android/app/build/outputs/apk/release/*.apk APK_FINAL/Meteory-IA-v1.0.1-NATIVO-arm64-v8a.apk
          ls -lh APK_FINAL/

      - name: ⬆️ Subir APK LISTO PARA INSTALAR
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v1.0.1-APK-REAL
          path: APK_FINAL/*.apk
          if-no-files-found: error
