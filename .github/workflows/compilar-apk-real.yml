name: Build Meteory IA v1.0.1
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: build-tools;34.0.0 platforms;android-34 ndk;25.2.9519653

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact --no-audit --no-fund

      - name: Build web app
        run: |
          npm run build || npx vite build
          ls -la dist

      - name: Capacitor init
        run: |
          rm -rf android capacitor.config.* www public
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" --web-dir=dist
          node -e "const fs=require('fs');let t=fs.readFileSync('capacitor.config.ts','utf8');t=t.replace(/(appId:\s*['\"][^'\"]+['\"])/,\"\$1,\n  appName: 'Meteory IA',\n  version: '1.0.1'\");fs.writeFileSync('capacitor.config.ts',t);console.log(t)"
          npx cap add android
          npx cap sync android

      - name: Copy custom icon
        run: |
          SRC=""
          test -f icono_meteory.png && SRC=icono_meteory.png
          test -f icono_meteory.jpg && SRC=icono_meteory.jpg
          if [ -n "$SRC" ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp -f $SRC android/app/src/main/res/$d/ic_launcher.png
              cp -f $SRC android/app/src/main/res/$d/ic_launcher_round.png
            done
            echo OK_ICON
          else
            echo NO_ICON
          fi

      - name: Patch AndroidManifest (permissions + label)
        run: |
          node <<'JS'
          const fs = require('fs');
          const M = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(M, 'utf8');
          xml = xml.replace(/<uses-permission[^>]*>\s*/g, '');
          const perms = [
            'INTERNET',
            'READ_MEDIA_IMAGES',
            'READ_MEDIA_VIDEO',
            'READ_EXTERNAL_STORAGE" android:maxSdkVersion="32',
            'WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32',
            'RECORD_AUDIO',
            'SYSTEM_ALERT_WINDOW',
            'SCHEDULE_EXACT_ALARM',
            'USE_EXACT_ALARM',
            'POST_NOTIFICATIONS',
            'WAKE_LOCK',
            'RECEIVE_BOOT_COMPLETED',
            'MODIFY_AUDIO_SETTINGS',
            'FOREGROUND_SERVICE',
            'FOREGROUND_SERVICE_MEDIA_PROJECTION',
            'FOREGROUND_SERVICE_MICROPHONE'
          ].map(p => `<uses-permission android:name="android.permission.${p}" />`).join('\n    ');
          xml = xml.replace(/(<application)/, perms + '\n    $1');
          xml = xml.replace(/android:label="[^"]*"/, 'android:label="Meteory IA"');
          fs.writeFileSync(M, xml);
          console.log(xml.split('\n').slice(0,80).join('\n'));
          JS

      - name: Generate keystore
        run: |
          rm -f $HOME/meteory.keystore
          keytool -genkey -v -keystore $HOME/meteory.keystore -alias meteory -keyalg RSA -keysize 2048 -validity 10000 -storepass meteory123 -keypass meteory123 -dname "CN=Niquel Gomez, OU=Meteory IA, O=Dev, L=Cochabamba, ST=Cochabamba, C=BO"

      - name: Build APK arm64-v8a
        run: |
          cd android
          ./gradlew assembleRelease -Pandroid.injected.signing.store.file=$HOME/meteory.keystore -Pandroid.injected.signing.store.password=meteory123 -Pandroid.injected.signing.key.alias=meteory -Pandroid.injected.signing.key.password=meteory123 -PabiFilters=arm64-v8a

      - name: Prepare final APK
        run: |
          mkdir -p APK_FINAL
          ORIG=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$ORIG" ]; then echo APK_FAIL; exit 1; fi
          cp $ORIG APK_FINAL/Meteory-IA-v1.0.1-arm64-v8a.apk
          ls -lh APK_FINAL

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v1.0.1-APK-LISTO
          path: APK_FINAL/*.apk
          if-no-files-found: error
