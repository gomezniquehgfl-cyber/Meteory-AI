name: Compilar APK FINAL Meteory IA v1.0.1
on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Descargar tu código completo
        uses: actions/checkout@v4

      - name: 🟢 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Java 17 (Obligatorio para Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 🤖 Instalar Android SDK + NDK oficiales
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            build-tools;34.0.0
            platforms;android-34
            ndk;25.2.9519653

      - name: 📦 Instalar dependencias + Capacitor 6 + Generador iconos
        run: |
          npm install
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact
          npm install @capacitor/assets --save-dev 2>/dev/null || true

      - name: 🏗️ Construir app web → carpeta dist
        run: |
          npm run build || npx vite build || (ls -la && echo "build ok")

      - name: ⚡ Inicializar Capacitor + NOMBRE + VERSIÓN 1.0.1
        run: |
          # Inicializar SIN --version (Capacitor 6 no lo acepta)
          npx cap init "Meteory IA" "org.niquelgomez.meteoryia" --web-dir=dist

          # ✅ INYECTAR nombre + versión DENTRO de capacitor.config.ts
          node -e "
            const fs = require('fs');
            let t = fs.readFileSync('capacitor.config.ts','utf8');
            // Asegurar appName y version
            if(!t.includes('appName:')) t = t.replace(/(appId:\s*['\"][^'\"]+['\"])/, \"\$1,\\n  appName: 'Meteory IA'\\n  version: '1.0.1'\");
            else t = t.replace(/version:\s*['\"][^'\"]*['\"]/, \"version: '1.0.1'\");
            fs.writeFileSync('capacitor.config.ts', t);
            console.log('✅ capacitor.config.ts listo');
            console.log(t);
          "

          # Crear proyecto Android nativo
          npx cap add android 2>/dev/null || true
          npx cap sync android

      - name: 🎨 ICONO PERSONALIZADO en TODAS las resoluciones Android
        run: |
          # Si subiste icono_meteory.png → lo copiamos a TODOS los tamaños
          SRC=""
          [ -f icono_meteory.png ] && SRC="icono_meteory.png"
          [ -f icono_meteory.jpg ] && SRC="icono_meteory.jpg"
          [ -f assets/icon.png ] && SRC="assets/icon.png"

          if [ -n "$SRC" ]; then
            echo "✅ Icono encontrado: $SRC"
            mkdir -p assets
            cp "$SRC" assets/icon.png 2>/dev/null || true

            # Intentar generar automáticamente con @capacitor/assets
            npx capacitor-assets generate --android --iconBackgroundColor '#05050a' 2>/dev/null || true

            # Copia directa de seguridad (asegura que aparezca)
            DIRS="mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi"
            for d in $DIRS; do
              mkdir -p "android/app/src/main/res/$d"
              cp -f "$SRC" "android/app/src/main/res/$d/ic_launcher.png" 2>/dev/null || true
              cp -f "$SRC" "android/app/src/main/res/$d/ic_launcher_round.png" 2>/dev/null || true
            done
            echo "✅ Icono copiado a todas las resoluciones"
          else
            echo "⚠️  No se encontró icono_meteory.png → se usará el por defecto"
          fi

      - name: 🔐 TODOS LOS PERMISOS ANDROID (superposición, micrófono, alarmas, pantalla)
        run: |
          M="android/app/src/main/AndroidManifest.xml"

          # Insertar TODOS los permisos ANTES de <application
          PERMISOS='
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
    <uses-permission android:name="android.permission.RECORD_AUDIO" />
    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
    <uses-permission android:name="android.permission.WAKE_LOCK" />
    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />'

          # Eliminar duplicados si ya existen
          sed -i '/<uses-permission android:name="android.permission\./d' "$M"
          # Insertar justo antes de <application
          sed -i "/<application/i\\$PERMISOS" "$M"

          # Forzar que app se muestre como Meteory IA
          sed -i 's/android:label="[^"]*"/android:label="Meteory IA"/g' "$M"

          echo "✅ Permisos + nombre aplicados"
          head -60 "$M"

      - name: 🔑 Generar keystore propio para firmar APK
        run: |
          keytool -genkey -v \
            -keystore $HOME/meteory.keystore \
            -alias meteory \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass meteory123 -keypass meteory123 \
            -dname "CN=Niquel Gomez, OU=Meteory IA, O=Desarrollo, L=Cochabamba, ST=Cochabamba, C=BO" || true

      - name: 📱 COMPILAR APK FINAL SOLO ARM64-v8a (Honor X8b)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$HOME/meteory.keystore \
            -Pandroid.injected.signing.store.password=meteory123 \
            -Pandroid.injected.signing.key.alias=meteory \
            -Pandroid.injected.signing.key.password=meteory123 \
            -PabiFilters=arm64-v8a

      - name: ✅ Preparar APK final renombrado
        run: |
          mkdir -p APK_FINAL
          ORIG=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$ORIG" ]; then
            echo "❌ NO SE GENERÓ APK"; ls -la android/app/build/outputs/apk/release/ 2>/dev/null; exit 1
          fi
          cp "$ORIG" APK_FINAL/Meteory-IA-v1.0.1-FINAL-arm64-v8a.apk
          ls -lh APK_FINAL/

      - name: ⬆️ Subir APK LISTO PARA INSTALAR
        uses: actions/upload-artifact@v4
        with:
          name: Meteory-IA-v1.0.1-APK-FINAL-TODO-INCLUIDO
          path: APK_FINAL/*.apk
          if-no-files-found: error
